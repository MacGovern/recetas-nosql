<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categorías — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav id="nav-root"></nav>
  <main class="container pb-5">
    <h1 class="h3 mb-3">Categorías</h1>

    <div id="alertas"></div>

    <div class="table-responsive mb-4">
      <table class="table table-sm align-middle">
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Slug</th>
            <th scope="col">Descripción</th>
            <th scope="col"><span class="visually-hidden">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="tabla-categorias"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3">Nueva categoría</h2>
        <div id="alertas-alta"></div>
        <form id="form-categoria" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="categoria-nombre">Nombre</label>
              <input class="form-control" id="categoria-nombre" name="nombre" type="text" autocomplete="off" required>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="categoria-descripcion">Descripción</label>
              <input class="form-control" id="categoria-descripcion" name="descripcion" type="text" autocomplete="off">
              <div class="form-text">Puede quedar vacía.</div>
            </div>
          </div>
          <p class="form-text mt-2 mb-3">El slug se genera a partir del nombre y no cambia al renombrar.</p>
          <button class="btn btn-primary" type="submit">Crear categoría</button>
        </form>
      </div>
    </div>
  </main>
  <script type="module" src="/js/paginas/admin-categorias.js"></script>
</body>
</html>
