<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderaciones — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav id="nav-root"></nav>
  <main class="container pb-5">
    <h1 class="h3 mb-3">Historial de moderaciones</h1>

    <div id="alertas"></div>

    <div class="table-responsive mb-2">
      <table class="table table-sm align-top">
        <thead>
          <tr>
            <th scope="col">Fecha</th>
            <th scope="col">Moderador</th>
            <th scope="col">Tipo</th>
            <th scope="col">Contenido eliminado</th>
            <th scope="col">Motivo</th>
          </tr>
        </thead>
        <tbody id="tabla-moderaciones"></tbody>
      </table>
    </div>
    <div id="paginacion"></div>
  </main>
  <script type="module" src="/js/paginas/admin-moderaciones.js"></script>
</body>
</html>
