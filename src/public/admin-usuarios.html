<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav id="nav-root"></nav>
  <main class="container pb-5">
    <h1 class="h3 mb-3">Usuarios</h1>

    <div id="alertas"></div>

    <div class="table-responsive mb-2">
      <table class="table table-sm align-middle">
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Email</th>
            <th scope="col">Rol</th>
            <th scope="col">Registro</th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
    <div id="paginacion" class="mb-4"></div>

    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3">Crear administrador</h2>
        <div id="alertas-admin"></div>
        <form id="form-admin" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="admin-nombre">Nombre</label>
              <input class="form-control" id="admin-nombre" name="nombre" type="text" autocomplete="off" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="admin-email">Email</label>
              <input class="form-control" id="admin-email" name="email" type="email" autocomplete="off" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="admin-password">Contraseña</label>
              <input class="form-control" id="admin-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
              <div class="form-text">Mínimo 8 caracteres.</div>
            </div>
          </div>
          <p class="form-text mt-2 mb-3">Se crea una cuenta nueva con rol admin. No inicia sesión en su nombre.</p>
          <button class="btn btn-primary" type="submit">Crear administrador</button>
        </form>
      </div>
    </div>
  </main>
  <script type="module" src="/js/paginas/admin-usuarios.js"></script>
</body>
</html>
