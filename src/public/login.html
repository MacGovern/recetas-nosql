<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav id="nav-root"></nav>
  <main class="container">
    <div class="card tarjeta-auth">
      <div class="card-body">
        <h1 class="h4 mb-3">Ingresar</h1>
        <div id="alertas"></div>
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>
        <p class="mt-3 mb-0 small">¿No tenés cuenta? <a href="/registro.html">Registrate</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/paginas/login.js"></script>
</body>
</html>
