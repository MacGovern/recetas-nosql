<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receta — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav id="nav-root"></nav>
  <main class="container pb-5">
    <h1 class="h3 mb-3" id="titulo-pagina">Receta</h1>
    <div id="alertas"></div>

    <form id="form-receta" novalidate>
      <section class="card card-body mb-4">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="titulo">Título</label>
            <input class="form-control" id="titulo" name="titulo" type="text">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="porciones">Porciones</label>
            <input class="form-control" id="porciones" name="porciones" type="text" inputmode="numeric">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="tiempoPreparacionMin">Preparación (min)</label>
            <input class="form-control" id="tiempoPreparacionMin" name="tiempoPreparacionMin" type="text" inputmode="numeric">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="tiempoCoccionMin">Cocción (min)</label>
            <input class="form-control" id="tiempoCoccionMin" name="tiempoCoccionMin" type="text" inputmode="numeric">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="dificultad">Dificultad</label>
            <select class="form-select" id="dificultad" name="dificultad">
              <option value="facil">Fácil</option>
              <option value="media" selected>Media</option>
              <option value="dificil">Difícil</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="paisOrigen">País de origen (opcional)</label>
            <input class="form-control" id="paisOrigen" name="paisOrigen" type="text" maxlength="2" placeholder="IT">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="tipo">Tipo (opcional)</label>
            <select class="form-select" id="tipo" name="tipo">
              <option value="">Sin tipo</option>
              <option value="horno">Horno</option>
              <option value="trago">Trago</option>
              <option value="asado">Asado</option>
              <option value="olla">Olla</option>
            </select>
          </div>

          <!-- Campos derivados: JS muestra solo el bloque del tipo elegido. "olla" no tiene ninguno. -->
          <div class="col-12 col-md-6" data-tipo-bloque="horno" hidden>
            <label class="form-label" for="temperaturaHornoC">Temperatura del horno (°C)</label>
            <input class="form-control" id="temperaturaHornoC" name="temperaturaHornoC" type="text" inputmode="numeric">
          </div>
          <div class="col-12 col-md-6" data-tipo-bloque="trago" hidden>
            <label class="form-label" for="tipoVaso">Tipo de vaso</label>
            <input class="form-control" id="tipoVaso" name="tipoVaso" type="text">
          </div>
          <div class="col-12 col-md-6" data-tipo-bloque="asado" hidden>
            <label class="form-label" for="tipoLenia">Tipo de leña</label>
            <input class="form-control" id="tipoLenia" name="tipoLenia" type="text">
          </div>
          <div class="col-12 col-md-6" data-tipo-bloque="asado" hidden>
            <label class="form-label" for="puntoCoccion">Punto de cocción</label>
            <input class="form-control" id="puntoCoccion" name="puntoCoccion" type="text">
          </div>
        </div>
      </section>

      <section class="card card-body mb-4">
        <h2 class="h5">Categorías</h2>
        <div id="campo-categorias"></div>
        <div class="form-text">Elegí al menos una.</div>
      </section>

      <section class="card card-body mb-4">
        <h2 class="h5">Ingredientes</h2>
        <div id="lista-ingredientes"></div>
        <div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-agregar-ingrediente">+ Agregar ingrediente</button>
        </div>
        <div class="form-text mt-2">Los nombres se guardan en minúsculas.</div>
      </section>

      <section class="card card-body mb-4">
        <h2 class="h5">Pasos</h2>
        <div id="lista-pasos"></div>
        <div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-agregar-paso">+ Agregar paso</button>
        </div>
      </section>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar receta</button>
        <a class="btn btn-outline-secondary" href="/index.html">Cancelar</a>
      </div>
    </form>
  </main>
  <script type="module" src="/js/paginas/receta-form.js"></script>
</body>
</html>
