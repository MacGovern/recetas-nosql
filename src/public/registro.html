<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav id="nav-root"></nav>
  <main class="container">
    <div class="card tarjeta-auth">
      <div class="card-body">
        <h1 class="h4 mb-3">Crear cuenta</h1>
        <div id="alertas"></div>
        <form id="form-registro" novalidate>
          <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" name="nombre" type="text" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <div class="form-text">Mínimo 8 caracteres.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Registrarme</button>
        </form>
        <p class="mt-3 mb-0 small">¿Ya tenés cuenta? <a href="/login.html">Ingresá</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/paginas/registro.js"></script>
</body>
</html>
